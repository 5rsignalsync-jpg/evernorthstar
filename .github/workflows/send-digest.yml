# Daily AI digest — runs scripts/send_digest.py inside the live Fly machine.
# Generates the morning digest via Claude and emails it to all opted-in users.
#
# Job is idempotent at the user level: send_digest.py skips any user who
# received a digest in the last 18 hours, so re-running this workflow won't
# double-send.
#
# Requires Fly secrets: ANTHROPIC_API_KEY, RESEND_API_KEY (set via flyctl
# secrets set). Without them, the script logs a clear "feature pending"
# message and exits 0.
#
# Requires repo secret FLY_API_TOKEN.

name: Daily AI digest

on:
  schedule:
    # 12:00 UTC daily = 7am ET (8am EDT). Matches the "morning briefing" feel.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    name: Generate + send digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake the Fly machine
        run: |
          for i in 1 2 3 4 5; do
            if curl -s -m 10 -f https://evernorthstar.fly.dev/health > /dev/null; then
              echo "Machine awake (attempt $i)"
              exit 0
            fi
            echo "Machine still cold (attempt $i), sleeping…"
            sleep 4
          done
          echo "Could not wake machine after 5 attempts"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Run send_digest.py on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a evernorthstar --command \
            "/usr/local/bin/python -m scripts.send_digest"
