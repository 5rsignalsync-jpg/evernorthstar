# Hourly data refresh — runs scripts/refresh_all.py inside the live Fly machine
# via flyctl ssh, so DuckDB writes land directly on the persistent volume.
#
# --skip-news is set because FinBERT (~1.5GB peak RAM) doesn't fit on the
# 1024MB Fly machine. News ingest still happens locally via launchd on the
# Mac, OR you can flip this to a beefier machine and remove --skip-news.
#
# Requires repo secret FLY_API_TOKEN.

name: Hourly data refresh

on:
  schedule:
    - cron: '15 * * * *'   # every hour at :15 past
  workflow_dispatch:       # also runnable manually from the Actions tab

jobs:
  refresh:
    name: Refresh prices + scores
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Auto-stop machines need an HTTP request to wake them. `flyctl ssh`
      # alone does not trigger the auto-start path, so a cold machine
      # returns "app evernorthstar has no started VMs."
      # Hit /health first, wait briefly for boot, then proceed.
      - name: Wake the Fly machine
        run: |
          for i in 1 2 3 4 5; do
            if curl -s -m 10 -f https://evernorthstar.fly.dev/health > /dev/null; then
              echo "Machine awake (attempt $i)"
              exit 0
            fi
            echo "Machine still cold (attempt $i), sleeping…"
            sleep 4
          done
          echo "Could not wake machine after 5 attempts"
          exit 1

      - name: Run refresh on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a evernorthstar \
            -C "python -m scripts.refresh_all --skip-news"

      # Alerts run immediately after the refresh so triggers fire against
      # the fresh data, not the previous hour's data. The script has a 6h
      # cooldown so even though it runs hourly, no user can be spammed.
      - name: Scan + dispatch alerts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a evernorthstar \
            -C "python -m scripts.run_alerts"
