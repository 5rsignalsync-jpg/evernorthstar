# Auto-deploy backend to Fly.io on push to main.
#
# Requires repo secret FLY_API_TOKEN:
#   gh secret set FLY_API_TOKEN -b "$(fly auth token)"
# (or paste into GitHub repo Settings → Secrets and variables → Actions)
#
# Skipped for changes that only touch web/ (frontend) or docs.

name: Deploy backend to Fly

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '**.md'
      - '.github/workflows/refresh-data.yml'
      - 'Library/**'
      - '*.plist'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
