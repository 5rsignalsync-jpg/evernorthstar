[project]
name = "crypto-trends"
version = "0.1.0"
description = "Crypto trend tracker that ranks long/short candidates from price, sentiment, and on-chain signals"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "bcrypt>=4.0",
    "ccxt>=4.4.0",
    "cryptography>=49.0.0",
    "duckdb>=1.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "feedparser>=6.0.12",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plaid-python>=40.0.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "resend>=2.30.1",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.16",
    "stripe>=15.2.0",
    "torch<2.3",
    "transformers>=4.40,<4.50",
    "uvicorn[standard]>=0.32.0",
    "vadersentiment>=3.3.2",
    "yfinance>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_trends"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
