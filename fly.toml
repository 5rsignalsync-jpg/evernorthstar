# fly.toml app configuration file generated for theevernorthstar on 2026-06-09T16:36:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'theevernorthstar'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGINS = 'https://theevernorthstar.vercel.app,http://localhost:3000'
  PORT = '8080'

[[mounts]]
  source = 'signal_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
